<!-- reset-password.component.html -->

<div class="min-h-screen bg-[#f4f7fb] flex justify-center items-center px-6">

  <div class="w-full max-w-lg bg-white rounded-2xl shadow-xl border p-10">

    <div class="text-center mb-8">
      <div class="w-16 h-16 mx-auto rounded-full bg-blue-50 text-[#073b7a] flex items-center justify-center text-3xl mb-4">
        🔑
      </div>

      <h2 class="text-4xl font-bold text-[#073b7a]">
        Reset Password
      </h2>

      <p class="text-slate-500 mt-3">
        Create a new password for your CityWatch account.
      </p>
    </div>

    <form [formGroup]="resetForm" (ngSubmit)="resetPassword()" class="space-y-5">

      <!-- NEW PASSWORD -->
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-2">
          New Password
        </label>

        <div class="flex items-center gap-3 border rounded-xl px-4 py-3"
             [ngClass]="{'border-red-400': submitted && resetForm.get('newPassword')?.errors}">

          <span class="text-xl text-slate-400">🔒</span>

          <input
            [type]="showNewPassword ? 'text' : 'password'"
            formControlName="newPassword"
            placeholder="Enter new password"
            class="w-full outline-none text-slate-700">

          <button
            type="button"
            (click)="toggleNewPassword()"
            class="text-[#073b7a] font-semibold text-sm">
            {{ showNewPassword ? 'Hide' : 'Show' }}
          </button>
        </div>

        <p *ngIf="submitted && resetForm.get('newPassword')?.errors?.['required']"
           class="text-red-600 text-sm mt-2">
          New password is required
        </p>

        <p *ngIf="submitted && resetForm.get('newPassword')?.errors?.['minlength']"
           class="text-red-600 text-sm mt-2">
          Password must be at least 6 characters
        </p>
      </div>

      <!-- CONFIRM PASSWORD -->
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-2">
          Confirm Password
        </label>

        <div class="flex items-center gap-3 border rounded-xl px-4 py-3"
             [ngClass]="{'border-red-400': submitted && resetForm.get('confirmPassword')?.errors}">

          <span class="text-xl text-slate-400">🔐</span>

          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            formControlName="confirmPassword"
            placeholder="Confirm new password"
            class="w-full outline-none text-slate-700">

          <button
            type="button"
            (click)="toggleConfirmPassword()"
            class="text-[#073b7a] font-semibold text-sm">
            {{ showConfirmPassword ? 'Hide' : 'Show' }}
          </button>
        </div>

        <p *ngIf="submitted && resetForm.get('confirmPassword')?.errors?.['required']"
           class="text-red-600 text-sm mt-2">
          Confirm password is required
        </p>
      </div>

      <p *ngIf="successMessage"
         class="bg-green-50 text-green-700 border border-green-200 p-3 rounded-lg text-sm">
        {{successMessage}}
      </p>

      <p *ngIf="errorMessage"
         class="bg-red-50 text-red-700 border border-red-200 p-3 rounded-lg text-sm">
        {{errorMessage}}
      </p>

      <button
        type="submit"
        [disabled]="loading || !token"
        class="w-full bg-gradient-to-r from-[#073b7a] to-[#0a4c92] text-white py-4 rounded-xl font-bold shadow-lg disabled:opacity-60">

        <span *ngIf="!loading">Reset Password</span>
        <span *ngIf="loading">Please wait...</span>
      </button>

      <div class="text-center">
        <a routerLink="/login"
           class="text-sm font-bold text-[#073b7a] hover:underline">
          ← Back to Login
        </a>
      </div>

    </form>

  </div>

</div>
