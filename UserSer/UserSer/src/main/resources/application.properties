spring.application.name=UserSer




# Database Connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/citywatch?createDatabaseIfNotExist=true}

spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


spring.servlet.multipart.max-file-size = -1
spring.servlet.multipart.max-request-size =-1


#
cloudinary.cloudName=${CLOUDINARY_CLOUD_NAME}
cloudinary.apiKey=${CLOUDINARY_API_KEY}
cloudinary.apiSecret=${CLOUDINARY_API_SECRET}



jwt.secret=${JWT_SECRET}
jwt.expiration=3600000





management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

server.port=8081

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

eureka.instance.hostname=localhost
eureka.instance.ip-address=127.0.0.1
eureka.instance.prefer-ip-address=true


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}



spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

